<h2>Registered Volunteers</h2>

<table border="1">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>City</th>
    <th>Message</th>
</tr>

{% for v in volunteers %}
<tr>
    <td>{{ v[0] }}</td>
    <td>{{ v[1] }}</td>
    <td>{{ v[2] }}</td>
    <td>{{ v[3] }}</td>
    <td>{{ v[4] }}</td>
    <td>{{ v[5] }}</td>
</tr>
{% endfor %}
</table>
