{% extends "base.html" %}
{% block content %}

<section class="donation-section">
    <div class="donation-box">

        <h2>Support Our Mission ❤️</h2>

        <h3>Total Collected: ₹{{ total }}</h3>

        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>

        <div class="amount-buttons">
            <button onclick="setAmount(100)">₹100</button>
            <button onclick="setAmount(500)">₹500</button>
            <button onclick="setAmount(1000)">₹1000</button>
        </div>

        <input type="number" id="amount" placeholder="Enter Amount" required>

        <button class="pay-btn" onclick="payNow()">Donate with Razorpay</button>

        <hr>
        <h3>Or Pay via UPI</h3>
        <img src="{{ url_for('static', filename='upi_qr.png') }}" width="200">
        <p>UPI ID: yourname@upi</p>

    </div>
</section>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
function setAmount(val){
    document.getElementById("amount").value = val;
}

function payNow(){
    var name = document.getElementById("name").value;
    var email = document.getElementById("email").value;
    var amount = document.getElementById("amount").value;

    fetch("/create_order", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "amount=" + amount
    })
    .then(res => res.json())
    .then(order => {

        var options = {
            "key": "{{ key_id }}",
            "amount": order.amount,
            "currency": "INR",
            "order_id": order.id,
            "handler": function (response){

                fetch("/payment_success", {
                    method: "POST",
                    headers: {"Content-Type": "application/x-www-form-urlencoded"},
                    body:
                        "name=" + name +
                        "&email=" + email +
                        "&amount=" + amount +
                        "&payment_id=" + response.razorpay_payment_id
                })
                .then(res => res.text())
                .then(data => {
                    alert("Payment Successful ❤️ Thank You!");
                    window.location.reload();
                });
            }
        };

        var rzp = new Razorpay(options);
        rzp.open();
    });
}
</script>

{% endblock %}
